name: Generate PHP Documentation

on:
  push:
    branches:
      - '4.x'
  workflow_dispatch:

jobs:
  build-and-deploy-docs:
    runs-on: ubuntu-latest

  permissions:
    contents: write
    pages: write
    id-token: write

  steps:
    checkout-code:
      name: Checkout code
      uses: actions/checkout@4.x
      with:
        fetch-depth: 0
        
    generate-docs:
      name: Generate PHPDoc Documentation
      uses: docker://phpdoc/phpdoc:latest
      with:
        args: run -d . -t /data/docs

    upload-artifact:
      name: Upload artifact for GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs'

    deploy-pages:
      name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@4.x
      
